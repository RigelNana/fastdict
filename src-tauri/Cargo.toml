[package]
name = "fastdict-desktop"
version = "0.1.0"
edition = "2024"
description = "FastDict local desktop dictionary application"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fastdict = { path = "../server" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true
