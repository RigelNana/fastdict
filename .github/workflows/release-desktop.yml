name: Build Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-electron:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: --linux AppImage deb
          - platform: macos-latest
            args: --mac dmg
          - platform: windows-latest
            args: --win nsis

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev speex

      - name: Install frontend and Electron dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Rust dictionary engine
        run: cargo build --release --locked -p fastdict

      - name: Package Electron desktop app
        run: npx electron-builder ${{ matrix.args }} --publish never

      - name: Upload desktop installers
        uses: actions/upload-artifact@v4
        with:
          name: fastdict-desktop-${{ matrix.platform }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.exe
          if-no-files-found: warn
